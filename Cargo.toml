[package]
name = "iji"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simple package manager that builds packages from git repos"
keywords = ["package-manager", "git", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/Gr1shma/iji"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
